# Cargo.toml (root) — versions are pinned once here; every crate inherits them.
[workspace]
resolver = "3"
members = [
  "proto",                    # event and message formats
  "core",                     # rules, events, crypto, storage, peer sync
  "uniffi-bindgen",           # Kotlin/Swift bindings generator
  "desktop/ipc",              # UI ↔ service protocol
  "desktop/agent",            # privileged desktop service
  "desktop/app/src-tauri",    # needs desktop/app/ui/dist: built separately, see justfile
  "verify",                   # verification logic (no network, no disk)
  "desktop/sandbox",          # AppContainer launcher (no network)
  "desktop/verifier",         # desktop camera verifier
  "netfilter",                # family-mode local DNS server
  "apple/ffi",                # single library for iOS and macOS
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.100"  # = rust-toolchain.toml; keeps the resolver from settling on old versions
publish = false

[workspace.dependencies]
# --- Serialization and utilities
serde        = { version = "1.0.215", features = ["derive"] }
serde_json   = "1.0.133"
thiserror    = "2.0.3"
chrono       = { version = "0.4.38", default-features = false, features = ["std", "clock", "serde"] }
hex          = "0.4.3"
base64       = "0.22.1"
# --- Cryptography (SECURITY: do not add others without a design decision and 2 reviews)
age           = "0.11.1"
secrecy       = "0.10.3"
ed25519-dalek = { version = "2.1.1", features = ["rand_core", "zeroize"] }
sha2          = "0.10.8"
hmac          = "0.12.1"   # rotating LAN discovery names, offline approval codes
argon2        = "0.6.0"    # PIN, password and pattern hashes (ADR 0013)
rand          = "0.8.5"
zeroize       = { version = "1.8.1", features = ["derive"] }
# --- Encrypted storage
# 0.42: includes the SQLite fixed for RUSTSEC-2026-0459 (0.32 was vulnerable)
rusqlite = { version = "0.42.0", features = ["bundled-sqlcipher-vendored-openssl"] }
# --- Bindings
uniffi = "0.28.3"
# --- Family-mode DNS filter
hickory-proto   = { version = "0.26.3", default-features = false }  # parse and build DNS messages
minisign-verify = "0.3.0"                                           # verify signed category lists
# --- Network (NEVER in verify/). No servers: peers only (spike R1, plan 11).
tokio       = { version = "1.42.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
# QUIC between devices, dialed by key. No relay, no DNS/pkarr lookups, no port mapping (UPnP/NAT-PMP).
iroh        = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
# --- Observability (no personal data)
tracing            = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter", "json"] }
# --- Tests
proptest = "1.5.0"

# Argon2id with the real parameters (64 MiB) takes seconds unoptimized: keep tests fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true          # less reverse-engineering surface and smaller binaries
panic = "abort"       # no unwinding: more predictable behavior in the service
