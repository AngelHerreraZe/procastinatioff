# .github/workflows/ci.yml
# SECURITY: Every action must be pinned by full SHA (Renovate keeps them updated). The PR that enables CI
#    replaces the tags marked with "# pin SHA".
name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"        # every night: audit + long fuzzing

permissions:
  contents: read               # least privilege by default

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4                 # pin SHA
      - uses: dtolnay/rust-toolchain@master       # pin SHA
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2              # pin SHA
      - run: cargo fmt --all -- --check
      # The Tauri app is built in `desktop-windows` (it needs the built UI).
      - run: cargo clippy --workspace --exclude procastinatioff-app --all-targets -- -D warnings
      # Includes core/tests/two_devices.rs: devices pairing and syncing over real QUIC on the runner.
      - run: cargo test --workspace --exclude procastinatioff-app

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4                 # pin SHA
      - uses: EmbarkStudios/cargo-deny-action@v2  # pin SHA
      - run: cargo install --locked cargo-audit && cargo audit
      - run: cargo install --locked cargo-cyclonedx && cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4          # pin SHA
        with:
          name: sbom
          path: "**/*.cdx.json"

  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4                 # pin SHA
      - uses: dtolnay/rust-toolchain@master       # pin SHA
        with: { toolchain: "${{ env.RUST_TOOLCHAIN }}" }
      - run: python3 scripts/privacy_scan.py
      - run: python3 scripts/check_i18n.py
      - run: python3 scripts/check_verify_no_net.py
      - run: python3 scripts/build_category_list.py --test

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4                 # pin SHA
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --exit-code 1

  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4                 # pin SHA
      - name: semgrep
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.97.0 semgrep scan --config p/rust --config p/secrets --config p/kotlin --error /src

  desktop-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4                 # pin SHA
      - uses: dtolnay/rust-toolchain@master       # pin SHA
        with: { toolchain: "${{ env.RUST_TOOLCHAIN }}", components: clippy }
      - uses: actions/setup-node@v4               # pin SHA
        with: { node-version: "22" }
      - run: npm ci --prefix desktop/app/ui
      - run: npm run --prefix desktop/app/ui check
      - run: npm run --prefix desktop/app/ui build
      - run: cargo clippy -p procastinatioff-app -p procastinatioff-agent -p procastinatioff-verifier -- -D warnings
      - run: cargo build -p procastinatioff-agent -p procastinatioff-verifier --release
      # SECURITY: Privacy audit, test 4: the verifier inside the AppContainer has NO network
      - run: cargo test -p procastinatioff-verifier --test sandbox_no_network

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4                 # pin SHA
      - uses: actions/setup-java@v4               # pin SHA
        with: { distribution: temurin, java-version: "17" }
      - uses: dtolnay/rust-toolchain@master       # pin SHA
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: android-actions/setup-android@v3    # pin SHA
      - run: sdkmanager "ndk;27.2.12479018" "build-tools;35.0.0" "platforms;android-35"
      - run: cargo install --locked cargo-ndk
      # Bindings from the DEBUG libraries: the release ones are stripped and uniffi-bindgen then
      # generates nothing without failing (stale bindings → "checksum mismatch" crash on start).
      - run: cargo build -p procastinatioff-core -p procastinatioff-verify
      - run: cargo run -p uniffi-bindgen -- generate --library target/debug/libprocastinatioff_core.so --language kotlin --out-dir android/app/src/main/java
      - run: cargo run -p uniffi-bindgen -- generate --library target/debug/libprocastinatioff_verify.so --language kotlin --out-dir android/verifier/src/main/java
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :verifier:assembleRelease
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
      - run: python3 scripts/check_android_permissions.py "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" android/app/build/outputs/apk/release/app-release-unsigned.apk
      # SECURITY: The verifier can NEVER have network permissions (privacy audit, test 1)
      - run: python3 scripts/check_android_permissions.py "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" android/verifier/build/outputs/apk/release/verifier-release-unsigned.apk --verifier

  # Rust core for every Apple target (XCFramework) and the Swift bindings, then every Swift source
  # (app, extensions, VerifierKit) type-checked against the iOS SDK. There is no Xcode project in
  # the repository yet (plan 08 · step 2): this is what keeps the Swift compiling until then.
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4                 # pin SHA
      - uses: dtolnay/rust-toolchain@master       # pin SHA
        with: { toolchain: "${{ env.RUST_TOOLCHAIN }}" }
      - run: bash scripts/build_apple.sh
      - run: >
          xcrun --sdk iphoneos swiftc -typecheck -parse-as-library -target arm64-apple-ios16.0
          -I target/apple/headers target/apple/swift/*.swift $(find apple -name '*.swift')

  fuzz-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4                 # pin SHA
      - uses: dtolnay/rust-toolchain@nightly      # pin SHA
      - run: cargo install --locked cargo-fuzz
      - run: cd core && for t in $(cargo +nightly fuzz list); do cargo +nightly fuzz run "$t" -- -max_total_time=600; done
