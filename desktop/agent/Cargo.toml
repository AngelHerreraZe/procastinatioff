[package]
name = "procastinatioff-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
procastinatioff-core = { path = "../../core" }
procastinatioff-ipc = { path = "../ipc" }
procastinatioff-netfilter = { path = "../../netfilter" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# LAN discovery (DNS-SD over mDNS): pure Rust, no system service needed. Plan 11, step 4.
mdns-sd = { version = "=0.21.7", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# fanotify (decide before each exec), CLOCK_BOOTTIME, kill, no core dumps. Plan 09 · A.2.
nix = { version = "0.32.0", default-features = false, features = ["fanotify", "fs", "time", "signal", "process"] }
# Secrets under the systemd-creds master key (already in the tree through `age`).
chacha20poly1305 = "0.10.1"
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.7.0"
winreg = "0.52.0"
windows = { version = "0.58.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",  # WTHelperProvDataFromStateData / WTHelperGetProvSignerFromChain
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

# Linux package (`cargo deb -p procastinatioff-agent`). The UI ships in its own package (Tauri).
# The signed category list joins `assets` once its key exists (pending admin task 11): /usr/lib/procastinatioff/lists/.
[package.metadata.deb]
maintainer = "ProcastinatiOFF maintainers"
copyright = "2026, ProcastinatiOFF maintainers"
section = "admin"
depends = "$auto, systemd (>= 250), nftables"
assets = [
  ["target/release/procastinatioff-agent", "usr/lib/procastinatioff/", "755"],
  ["../../packaging/linux/procastinatioff-agent.service", "lib/systemd/system/", "644"],
]
maintainer-scripts = "../../packaging/linux/debian/"
