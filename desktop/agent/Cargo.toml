[package]
name = "procastinacioff-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
procastinacioff-core = { path = "../../core" }
procastinacioff-ipc = { path = "../ipc" }
procastinacioff-netfilter = { path = "../../netfilter" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.7.0"
winreg = "0.52.0"
windows = { version = "0.58.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",  # WTHelperProvDataFromStateData / WTHelperGetProvSignerFromChain
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }
