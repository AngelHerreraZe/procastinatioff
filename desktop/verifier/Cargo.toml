# SECURITY: Desktop verifier. Runs INSIDE an AppContainer without network (the UI launches it with
# procastinatioff-sandbox). Never writes to disk: frames in RAM and one JSON line on stdout.
[package]
name = "procastinatioff-verifier"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
procastinatioff-verify = { path = "../../verify" }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tract-onnx = "0.23.10"                                             # pure-Rust ONNX inference (no extra DLLs)

[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10.11", features = ["input-native"] }     # camera (Media Foundation), in memory

[dev-dependencies]
procastinatioff-sandbox = { path = "../sandbox" }
