# 🔒 Verificador de escritorio. Corre DENTRO de un AppContainer sin red (lo lanza la UI con
# procastinacioff-sandbox). Nunca escribe a disco: cuadros en RAM y una línea JSON por stdout.
[package]
name = "procastinacioff-verifier"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
procastinacioff-verify = { path = "../../verify" }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tract-onnx = "0.23.10"                                             # inferencia ONNX en Rust puro (sin DLLs extra)

[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10.11", features = ["input-native"] }     # cámara (Media Foundation), en memoria

[dev-dependencies]
procastinacioff-sandbox = { path = "../sandbox" }
