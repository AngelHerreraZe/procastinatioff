# Spike R1 (throwaway): iroh by key, LAN only, no third-party discovery.
[package]
name = "spike-r1-p2p"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
