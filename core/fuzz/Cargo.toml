# Fuzzing of the core's parsers (security-critical; needs nightly + cargo-fuzz): `just fuzz open_blob 600`
[package]
name = "procastinatioff-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
procastinatioff-core = { path = ".." }
procastinatioff-proto = { path = "../../proto" }
age = "0.11.1"
serde_json = "1.0.133"

# Its own workspace: not part of the repository's `cargo test --workspace`.
[workspace]
members = ["."]

[[bin]]
name = "open_blob"
path = "fuzz_targets/open_blob.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_qr"
path = "fuzz_targets/parse_qr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signed_event"
path = "fuzz_targets/signed_event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_msg"
path = "fuzz_targets/read_msg.rs"
test = false
doc = false
bench = false
