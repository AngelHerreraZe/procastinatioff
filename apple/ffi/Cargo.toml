# A single static library for iOS and macOS.
[package]
name = "procastinatioff-apple"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "procastinatioff_apple"
crate-type = ["staticlib"]

[dependencies]
procastinatioff-core = { path = "../../core" }
procastinatioff-verify = { path = "../../verify" }
